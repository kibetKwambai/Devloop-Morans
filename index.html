<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VerifiedHire - The Elite Standard for Professional Integrity</title>
    <meta name="description" content="The elite standard for professional integrity. VerifiedHire connects pre-vetted talent with high-performance institutions through surgical-grade manual verification and Google Gemini AI matching." />
    <meta property="og:title" content="VerifiedHire - The Elite Standard for Professional Integrity" />
    <meta property="og:description" content="The elite standard for professional integrity. VerifiedHire connects pre-vetted talent with high-performance institutions through surgical-grade manual verification and Google Gemini AI matching." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#EEF2FF',
                100: '#E0E7FF',
                200: '#C7D2FE',
                300: '#A5B4FC',
                400: '#818CF8',
                500: '#6366F1',
                600: '#4F46E5', // LOCKED PRIMARY BRAND COLOR
                700: '#4338CA',
                800: '#3730A3',
                900: '#312E81',
                950: '#1E1B4B',
              },
              obsidian: {
                base: '#0B0B0F',
                surface: '#121218',
                card: '#16161F',
                border: '#232330',
                muted: '#8E8E9E'
              }
            },
            fontFamily: {
              sans: ['Outfit', 'Plus Jakarta Sans', 'Inter', 'sans-serif'],
              display: ['Outfit', 'Space Grotesk', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
            }
          }
        }
      };

      // Prevent FOUC (Flash of Unstyled Content) for dark mode
      try {
        var savedTheme = localStorage.getItem('theme');
        var isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && isSystemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  <script type="importmap">

    "@google/genai": "https://esm.sh/@google/genai@^1.8.0"
  }
}
</script>
